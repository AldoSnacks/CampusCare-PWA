# Despliegue en Render (https://render.com) — New → Blueprint
services:
  - type: web
    name: campuscare
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/salud
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: JWT_SECRET
        generateValue: true
      - key: VAPID_SUBJECT
        value: mailto:soporte@institucion.edu.mx
